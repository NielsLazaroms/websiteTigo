<section class="page">
  <div class="hero">
    <p class="eyebrow" data-rise="head">Fout 404: pagina niet gevonden</p>

    <div class="four04-wrap">
      <div class="four04" role="img" aria-label="Foutcode 404">
        <span class="four04__sizer" aria-hidden="true">404</span>
        <span class="four04__layer four04__layer--ghost" aria-hidden="true">404</span>
        <span class="four04__layer four04__layer--paint" aria-hidden="true">404</span>

        <span class="four04__drips" aria-hidden="true">
          <!-- Anchored to real stroke bottoms: one off the first 4, hero drip off the 0, one off the second 4-stem. -->
          <i class="four04__drip" style="left: 8%; --drip-h: 0.08em; --rise: 0.010em"></i>
          <i class="four04__drip" style="left: 50%; --drip-h: 0.11em; --rise: 0.435em"></i>
          <i class="four04__drip" style="left: 79%; --drip-h: 0.08em; --rise: 0.010em"></i>
        </span>

        <span class="four04__roller" aria-hidden="true">
          <span class="four04__sleeve"></span>
          <span class="four04__cap four04__cap--top"></span>
          <span class="four04__arm"></span>
          <span class="four04__knuckle"></span>
          <span class="four04__grip"></span>
        </span>
      </div>
    </div>

    <h1 class="headline" data-rise="body">
      Deze pagina krijgt<br />
      nog een <span class="headline__accent">verflaag</span>.
    </h1>

    <p class="lede" data-rise="body">
      Deze pagina bestaat niet, of nog niet. Controleer het adres, of ga verder via een van de
      pagina’s hieronder.
    </p>

    <div class="actions btn-row" data-rise="body">
      <a class="btn" routerLink="/">Naar de homepage</a>
      <a class="btn btn--line" routerLink="/projecten">Bekijk projecten</a>
    </div>
  </div>
</section>
